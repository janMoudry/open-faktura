name: open-faktura
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: faktura
      POSTGRES_PASSWORD: faktura
      POSTGRES_DB: faktura
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faktura -d faktura"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
