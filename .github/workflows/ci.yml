name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
      - run: npm install --global pnpm@10.29.3
      - run: pnpm install --frozen-lockfile
      - run: rustup show
      - run: pnpm build:web
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --filter @open-faktura/desktop build --debug --bundles app
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
      - run: npm install --global pnpm@10.29.3
      - run: pnpm install --frozen-lockfile
      - run: rustup show
      - run: pnpm db:up
      - run: cp .env.example .env
      - run: node scripts/init-secrets.mjs
      - run: cargo build --locked -p faktura-server
      - run: pnpm generate:api && git diff --exit-code -- contracts packages/api-client/src
      - run: pnpm test:companies
        env:
          DATABASE_URL: postgres://faktura:faktura@127.0.0.1:54329/faktura
      - run: pnpm test:invoices
        env:
          DATABASE_URL: postgres://faktura:faktura@127.0.0.1:54329/faktura
      - run: pnpm test:smtp
        env:
          DATABASE_URL: postgres://faktura:faktura@127.0.0.1:54329/faktura
      - run: pnpm test:contacts
        env:
          DATABASE_URL: postgres://faktura:faktura@127.0.0.1:54329/faktura
      - run: pnpm test:auth
        env:
          DATABASE_URL: postgres://faktura:faktura@127.0.0.1:54329/faktura
      - run: cargo test --locked -p faktura-server --test sales --test delivery --test share --test invoice_delivery --test attachment --test export --test advance --test tax_receipt --test advance_settlement --test credit_note --test payment --test recurring --test communication --test invoice_share --test received --test bank -- --ignored --test-threads=1
        env:
          DATABASE_URL: postgres://faktura:faktura@127.0.0.1:54329/faktura
      - run: cargo test --locked -p faktura-server --test inbox --test inbox_mailbox --test bank_notification --test stock --test retail --test cash --test period_report --test isdoc --test vat_registry --test vies --test company_admin --test document_tags --test document_output --test document_style --test document_exports --test dashboard_widgets --test tax_classification --test draft_trash -- --include-ignored --test-threads=1
        env:
          DATABASE_URL: postgres://faktura:faktura@127.0.0.1:54329/faktura
          BANK_ENCRYPTION_KEY_FILE: .secrets/bank-key
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          target/debug/faktura-server > /tmp/faktura-api.log 2>&1 &
          trap 'kill $! || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3001/api/ready; then break; fi
            sleep 1
          done
          pnpm test:e2e
      - if: always()
        run: cat /tmp/faktura-api.log || true
